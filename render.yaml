services:
  - type: web
    name: ecommerce-multi-agent-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --api
    envVars:
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///ecommerce.db
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
